<!DOCTYPE html>


<html>
  <head>
    <link rel="stylesheet" href="/LoginForm/login.css">
    <meta charset="UTF-8">
    <title>Pokemon battle Вход</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  </head>

  <body>
    <div class="loginForm">
      <img src="../image/picka.png" alt="" class="imageLogin">
      <h2>POKEMON BATTLE</h2>

      <span class="spanForm"></span>

      <div class="formLogin">
        <div class="divLogin">
          <label for="username">Имя тренера</label>
          <div class="nameNinput">
            <i class="fas fa-user"></i>
            <input type="text" id="username" placeholder="Введите ваше имя" required>
          </div>
        <div class="divLogin">
          <label for="password">Пароль</label>
          <div class="nameNinput">
            <i class="fas fa-lock clickToreveal"></i>
            <input class="changeType" type="password" id="password" placeholder="Введите пароль" required>
          </div>
        </div>
        <button class="buttonLogin"></button>


        <div class="registerText"></div>
        
        
      </div>
    </div>

    <script src="/LoginForm/login.js"></script>
  </body>

</html>
