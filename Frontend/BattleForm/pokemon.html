<!DOCTYPE html>

<html>
  <head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="pokemon.css">
    <link rel="stylesheet" href="../main.css">
    <link rel="stylesheet" href="../mainLobby/animation.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>

  <body>
    <script src="../header.js"></script>

    <p class="pokeballImg"><img src="../image/pokeball.png" alt=""></p>

    <div class="modal-menu">
      <div class="window-menu">
        <div class="pokeball-menu">
          <div class="pokeball-color">
            <div class="pokeball-color-top"></div>
            <div class="pokeball-color-line"></div>
            <div class="pokeball-center"></div>
          </div>
        </div>
        <p class="quit-text-menu">Вы уверены, что хотите выйти?</p>
        <div class="warning-text-menu">
          <p>⚠️ Выход из боя приравнивается к поражению.</p>
          <p>Ваш рейтинг понизится, а победа засчитается противнику.</p>
        </div>
        <div class="div-quit-menu">
          <button class="button-quit-menu menu-keep"><i class="fa fa-arrow-left"></i> Остаться</button>
          <button class="button-quit-menu menu-quit"><i class="fa fa-right-from-bracket"></i> Выйти</button>
        </div>
      </div>
    </div>
    
    <div class="modal-windows-victoryLose">
      <div class="victoryLose"></div>
    </div>






    <div class="threeZones">
      <div class="fightZone">
        <div class="imageZone">
          <div class="divImage pokemonPlayer"></div>
          <div class="divImage pokemonBot"></div>
          <div class="playerHp">
            <p class="pokemonName"></p>
            <div class="display-Flex">
              <div class="hp-bar">
                <div class="hp-bar-fill"></div>
              </div>
              <p class="procentOfHP"></p>
            </div>

          </div>

          <div class="enemyHp">
            <p class="pokemonName"></p>
            <div class="display-Flex">
              <div class="hp-bar">
                <div class="hp-bar-fill"></div>
              </div>
              <p class="procentOfHP"></p>
            </div>
          </div>
        </div>
        <p class="textUnderImg"></p>
        <p class="textBattleField attackText">Attack</p>
        <div class="divSkillName"></div>
        <div class="Switch-And-Heal">
          <div>
            <p class="textBattleField healText">Heal</p>
            <div class="HealToUse"></div>
          </div>
          <div>
            <p class="textBattleField switchText">Switch</p>
            <div class="pokemonToSwitch"></div>
          </div>
        </div>
      </div>

      <div class="battleLog"><p class="text-Battle-Log">Battle Log</p></div>

      <div class="someInfo">
        <div class="enemy-info">
          <p class="enemy-text"><i class="fa fa-user"></i> Enemy</p>
          <div class="enemy-avatar-name-online">
            <div class="enemy-avatar"></div>
            <div>
              <p class="enemy-name"></p>
              <p class="enemy-status"><span class="status-dot"></span>В сети</p>
            </div>
          </div>
          <div class="enemy-raiting">
            <p class="raiting-text">⭐ Рейтинг</p>
            <p class="raiting-amount"></p>
          </div>
        </div>

        <div class="score-in-battle"> 
          <p class="enemy-text"><i class="fa fa-trophy"></i> Battle score</p>
          <div class="score-div">
            <div>
              <p class="pokemon-aliveMy"></p>
            </div>
            <span class="semicolon">:</span>
            <div>
              <p class="pokemon-aliveEnemy"></p>
            </div>
          </div>
        </div>

        <div class="statistics-battle">
          <p class="enemy-text"><i class="fa fa-chart-bar"></i> Battle score</p>
          <div class="onerow-statistic">
            <p>Ходов:</p>
            <p class="turns_amount css-digit"></p>
          </div>
          <div class="onerow-statistic">
            <p>Нанесено:</p>
            <p class="damage-dealt css-digit"></p>
          </div>
          <div class="onerow-statistic">
            <p>Получено:</p>
            <p class="damage-taken css-digit"></p>
          </div>
          <div class="onerow-statistic no-border">
            <p>Живых:</p>
            <p class="myAlive css-digit"></p>
          </div>
        </div>

      </div>
    </div>

  
    <script type="module" src="pokemon.js"></script> 
  </body>

</html>
