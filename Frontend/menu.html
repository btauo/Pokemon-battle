<!DOCTYPE html>


<html>
  <head>
    <title>Pokemon Battle</title>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="main.css">
    <link rel="stylesheet" href="menu.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  </head>

  <body>
    <div class="modalWindowForAvatar">
      <div class="changeAvatarGrid">
        <h3>Выбери аватар</h3>
        <div class="avatars"></div>
        <button class="closeAvatars hover-animation">Закрыть</button>
      </div>

    </div>
    
    <div class="modal-settings" hidden>
      <div class="modal-window">
        <div class="pokeball-menu">
          <div class="pokeball-color">
            <div class="pokeball-color-top"></div>
            <div class="pokeball-color-line"></div>
            <div class="pokeball-center"></div>
          </div>
        </div>
        <p class="quit-text-menu font-size">⚙️ Настройки</p>
        <div class="div-avatars">
          <div class="avatar-in-settings"></div>
          <div class="trener-change-avatar">
            <p class="text-trener">Тренер</p>
            <p class="text-pickavatar">Выбери аватар и настрой игру</p>
            <button class="button-change-avatar hover-animation"><i class="fa fa-image"></i> Сменить аватар</button>
          </div>
        </div>

        <div class="volume">
          <p><i class="fa fa-volume-high"></i> Звук</p>
          <div class="volumethings">
            <input id="volumeRange" type="range" min="0" max="100" value="67">
            <span class="volumevalue">67%</span>
          </div>
        </div>

        <div class="volume change-theme">
          <p><i class="fa fa-palette"></i> Тёмная тема</p>
          <label class="switchtheme">
            <input type="checkbox">
            <span class="slider round"></span>
          </label>
        </div>

        <div class="volume language">
          <p><i class="fa fa-globe"></i></i> Язык</p>
          <select class="selectlanguage" id="languageSelect">
            <option value="ru">🇷🇺 Русский</option>
            <option value="en">🇬🇧 English</option>
            <option value="lv">🇱🇻 Latviešu</option>
          </select>
        </div>
        
        <div class="settings-button">
          <button class="aboutgame hover-animation"><i class="fa fa-circle-info"></i> О игре</button>
          <div>
            <button class="backtogame hover-animation"><i class="fa fa-arrow-left"></i> Назад</button>
            <button class="quitaccount hover-animation"><i class="fa fa-right-from-bracket"></i> Выйти из аккауната</button>
          </div>
        </div>
      </div>
    </div>


    <div class="mainLayout">
      <div class="stat-pokemon-shop">
        <!--statisctic-->
        <div class="card marginADD">
          <div class="playerNameRank">
            <div class="avatar-big" ></div>
            
            
            <div>
              <p class="Nickname"></p>
              <span class="player-rank">
                <i class="fa fa-trophy"></i>
                Master
              </span>
            </div>
          </div>
          <div class="statistic-grid"></div>
        </div>
        <!--pokemon-->
        <div class="card marginADD">
          <p class="marginADD menuText">
            <i class="fa fa-paw"></i>
             Игрок выбери 3 покемонов
          </p>

          <div class="PokemonSelect">
            <div class="pokemonGrid"></div> 
            <div class="amountPokemon">
              <p class="setText"></p>
              <button type="button" class="pokemonCard-button">⚔️ В бой</button>
            </div>
            
          </div>    
        </div>
        <!--shopich-->
        <div class="card">
          <p class="marginADD menuText">
            <i class="fa fa-flask"></i>
              Магазин зелий
          </p>
          <div class="allpotion"></div>
        </div>
      </div>

      <div class="peopleOnline">
        <div class="player-list"></div>
        <div class="btn-logout-div"><button class="btn-logout">
          <i class="fa fa-sign-out"></i>
          Выйти из аккаунта
        </button></div>
      </div>
    </div>


    <script src="menu.js" type="module"></script>
  </body>


</html>
